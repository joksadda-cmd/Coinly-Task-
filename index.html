<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinly Task Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#0f172a,#172554);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    overflow:hidden;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    text-align:center;
    background:rgba(30,41,59,0.9);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:20px;
    width:90%;
    max-width:500px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(59,130,246,0.4);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.icon{
    font-size:70px;
    animation:spin 3s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

h1{
    color:#facc15;
    margin:15px 0;
}

p{
    color:#e2e8f0;
    font-size:18px;
    line-height:1.7;
}

#timer{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:#facc15;
    letter-spacing:2px;
}

.channel-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:.3s;
    animation:pulse 2s infinite;
}

.channel-btn:hover{
    transform:scale(1.05);
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(59,130,246,.7);}
    70%{box-shadow:0 0 0 20px rgba(59,130,246,0);}
    100%{box-shadow:0 0 0 0 rgba(59,130,246,0);}
}

.loading{
    margin-top:20px;
    color:#94a3b8;
    font-size:15px;
}

.dots::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}
</style>
</head>
<body>

<div class="card">
    <div class="icon">🔧</div>

    <h1>Coinly Task</h1>

    <p>
        Repair in Progress<br>
        Please wait for the official announcement.
    </p>

    <div id="timer">04 Days 00:00:00</div>

    <a class="channel-btn" href="https://t.me/coinly_task" target="_blank">
        Check Official Channel
    </a>

    <div class="loading">
        Loading<span class="dots"></span>
    </div>
</div>

<script>
let timeLeft = 4 * 24 * 60 * 60; // 4 Days

function updateTimer() {
    const days = Math.floor(timeLeft / 86400);
    const hours = Math.floor((timeLeft % 86400) / 3600);
    const minutes = Math.floor((timeLeft % 3600) / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").innerHTML =
        String(days).padStart(2, '0') + " Days " +
        String(hours).padStart(2, '0') + ":" +
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0');

    if (timeLeft > 0) {
        timeLeft--;
    } else {
        document.getElementById("timer").innerHTML =
        "✅ Maintenance Complete";
    }
}

updateTimer();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
