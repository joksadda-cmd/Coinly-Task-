<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinly Task Bot Closed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000,#111,#000);
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.container{
    text-align:center;
    perspective:1000px;
}

.closed{
    font-size:70px;
    font-weight:bold;
    color:#ff2d2d;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
    animation:rotate3d 6s infinite ease-in-out;
}

.bot{
    margin-top:20px;
    font-size:38px;
    font-weight:bold;
    color:white;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #00d9ff;
    animation:float 3s infinite ease-in-out;
}

@keyframes rotate3d{
    0%{
        transform:rotateY(-25deg) rotateX(10deg);
    }
    50%{
        transform:rotateY(25deg) rotateX(-10deg);
    }
    100%{
        transform:rotateY(-25deg) rotateX(10deg);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particles span{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:move 10s linear infinite;
}

@keyframes move{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="particles">
    <span style="left:10%;animation-delay:0s"></span>
    <span style="left:20%;animation-delay:1s"></span>
    <span style="left:30%;animation-delay:2s"></span>
    <span style="left:40%;animation-delay:3s"></span>
    <span style="left:50%;animation-delay:4s"></span>
    <span style="left:60%;animation-delay:5s"></span>
    <span style="left:70%;animation-delay:2s"></span>
    <span style="left:80%;animation-delay:1s"></span>
    <span style="left:90%;animation-delay:3s"></span>
</div>

<div class="container">
    <div class="closed">PERMANENTLY CLOSED</div>
    <div class="bot">Coinly Task Bot</div>
</div>

</body>
</html>
